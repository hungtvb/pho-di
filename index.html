<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#a83232">
  <title>Phở Đi! 🍜</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<body>
  <div id="game">
    <div id="screen-intro" class="screen active">

    <div id="screen-counter" class="screen">
      <div style="text-align:center; padding: 2rem;">
        <div style="font-size: 3rem;">🍜</div>
        <h2 style="color: var(--chili); margin: 1rem 0;">Quầy bán</h2>
        <p style="color: var(--wood);">Đang phát triển (task 2.1)...</p>
        <button id="btn-back" class="btn-primary" style="margin-top: 1.5rem; font-size: 1.1rem; padding: 0.7rem 2rem;">← Quay lại</button>
      </div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>

</html>
